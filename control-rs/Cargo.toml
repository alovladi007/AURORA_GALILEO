[package]
name = "galileo-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "control"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"] }
numpy = "0.20"

# Numerical computation
nalgebra = "0.32"
ndarray = "0.15"
ndarray-linalg = "0.16"

# Optimization
osqp = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "control_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
