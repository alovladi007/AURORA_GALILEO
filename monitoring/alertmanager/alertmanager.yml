global:
  resolve_timeout: 5m
  # Slack webhook for alerts (configure in production)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Alert routing configuration
route:
  # Default receiver for all alerts
  receiver: 'default'
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']
  # Wait before sending notification for a new group
  group_wait: 10s
  # Wait before sending notification about new alerts for existing group
  group_interval: 10s
  # Wait before re-sending notification
  repeat_interval: 12h

  # Alert routing rules
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 3h

    # High priority alerts
    - match:
        severity: high
      receiver: 'high-priority'
      group_wait: 5s
      repeat_interval: 6h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warnings'
      repeat_interval: 24h

    # Database alerts
    - match:
        category: database
      receiver: 'database-team'

    # API/Service alerts
    - match:
        category: api
      receiver: 'backend-team'

# Alert receivers configuration
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#galileo-alerts'
        title: 'GALILEO Platform Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#galileo-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    # Add PagerDuty, email, or SMS for critical alerts
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'

  - name: 'high-priority'
    slack_configs:
      - channel: '#galileo-alerts'
        title: '⚠️  HIGH: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'warnings'
    slack_configs:
      - channel: '#galileo-warnings'
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'database-team'
    slack_configs:
      - channel: '#galileo-database'
        title: 'Database Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'backend-team'
    slack_configs:
      - channel: '#galileo-backend'
        title: 'API Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibit rules - prevent redundant alerts
inhibit_rules:
  # Inhibit warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit warning if high priority alert is firing
  - source_match:
      severity: 'high'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
