// Common message types for GALILEO microservices
syntax = "proto3";

package galileo.common;

import "google/protobuf/timestamp.proto";

// Standard response wrapper
message Response {
  int32 status_code = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> metadata = 4;
}

// Error details
message Error {
  string code = 1;
  string message = 2;
  repeated string details = 3;
  map<string, string> context = 4;
}

// Pagination request
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool ascending = 4;
}

// Pagination response
message PaginationResponse {
  int32 total_items = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
  int32 page_size = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

// Geolocation
message GeoLocation {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;  // meters
}

// Time range
message TimeRange {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

// User context for authorization
message UserContext {
  string user_id = 1;
  repeated string roles = 2;
  repeated string permissions = 3;
  string session_id = 4;
  map<string, string> metadata = 5;
}

// Health check
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  Status status = 1;
  string version = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> details = 4;
}
