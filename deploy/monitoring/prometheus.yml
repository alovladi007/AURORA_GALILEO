global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'galileo-dev'
    environment: 'development'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API gateway REST metrics (mounted /metrics endpoint)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: /metrics
