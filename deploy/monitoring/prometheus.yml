global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'galileo-dev'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # PostgreSQL exporter (when available)
  - job_name: 'postgresql'
    static_configs:
      - targets: []
        labels:
          service: 'postgresql'

  # Redis exporter (when available)
  - job_name: 'redis'
    static_configs:
      - targets: []
        labels:
          service: 'redis'

  # Application services (when deployed)
  - job_name: 'galileo-services'
    static_configs:
      - targets: []
        labels:
          service: 'galileo'
