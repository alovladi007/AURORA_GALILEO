version: '3.8'

# GALILEO Microservices Architecture
# For local development and testing

services:
  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile.simple
    ports:
      - "18000:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - DATA_SERVICE_ADDR=data-service:50051
      - GRPC_DATA_SERVICE_HOST=data-service:50051
      - GRPC_ML_SERVICE_HOST=ml-service:50052
      - GRPC_INVERSION_SERVICE_HOST=inversion-service:50053
      - GRPC_CONTROL_SERVICE_HOST=control-service:50054
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=info
    depends_on:
      - redis
      - data-service
      - ml-service
      - inversion-service
      - control-service
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Data Service
  data-service:
    build:
      context: .
      dockerfile: services/data-service/Dockerfile
    expose:
      - "50051"
    environment:
      - SERVICE_NAME=data-service
      - GRPC_PORT=50051
      - DATABASE_URL=postgresql://galileo:${DB_PASSWORD}@postgres:5432/galileo
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galileo
      - DB_USER=galileo
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
      - minio
      - jaeger
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    expose:
      - "50052"
    environment:
      - SERVICE_NAME=ml-service
      - GRPC_PORT=50052
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galileo
      - DB_USER=galileo
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
      - jaeger
    networks:
      - galileo-network
    volumes:
      - ml-models:/models
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Inversion Service
  inversion-service:
    build:
      context: .
      dockerfile: services/inversion-service/Dockerfile
    expose:
      - "50053"
    environment:
      - SERVICE_NAME=inversion-service
      - GRPC_PORT=50053
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galileo
      - DB_USER=galileo
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
      - minio
      - jaeger
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50053"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Control Service
  control-service:
    build:
      context: .
      dockerfile: services/control-service/Dockerfile
    expose:
      - "50054"
    environment:
      - SERVICE_NAME=control-service
      - GRPC_PORT=50054
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galileo
      - DB_USER=galileo
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
      - kafka
      - jaeger
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50054"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=galileo
      - POSTGRES_USER=galileo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "27432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/db/timescale_setup.sql:/docker-entrypoint-initdb.d/timescale_setup.sql
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galileo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "27379:6379"
    volumes:
      - redis-data:/data
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - galileo-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "29092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - galileo-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger (OpenTelemetry)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "29686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - galileo-network

  # MLflow
  mlflow:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y gcc python3-dev && rm -rf /var/lib/apt/lists/*
        RUN pip install mlflow==2.8.0 psycopg2-binary boto3
        EXPOSE 5000
        CMD ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "29500:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://galileo:${DB_PASSWORD}@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - PYTHONPATH=/app/src/gen:${PYTHONPATH}
    depends_on:
      - postgres
      - minio
    networks:
      - galileo-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "29090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - galileo-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "29091:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - galileo-network

networks:
  galileo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
  ml-models:
  prometheus-data:
  grafana-data:
