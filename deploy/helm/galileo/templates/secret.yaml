{{- if not .Values.externalSecrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: galileo-secrets
  labels:
    {{- include "galileo.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default (printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.secrets.databasePassword .Release.Name .Values.postgresql.auth.database) | quote }}
  database-password: {{ .Values.secrets.databasePassword | quote }}
  redis-url: {{ .Values.secrets.redisUrl | default (printf "redis://:%s@%s-redis-master:6379/0" .Values.secrets.redisPassword .Release.Name) | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | quote }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
{{- end }}
---
{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: galileo-secrets
  labels:
    {{- include "galileo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "SecretStore" }}
  target:
    name: galileo-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: galileo/database
        property: url
    - secretKey: database-password
      remoteRef:
        key: galileo/database
        property: password
    - secretKey: redis-url
      remoteRef:
        key: galileo/redis
        property: url
    - secretKey: redis-password
      remoteRef:
        key: galileo/redis
        property: password
    - secretKey: minio-access-key
      remoteRef:
        key: galileo/minio
        property: access_key
    - secretKey: minio-secret-key
      remoteRef:
        key: galileo/minio
        property: secret_key
    - secretKey: jwt-secret-key
      remoteRef:
        key: galileo/jwt
        property: secret_key
    - secretKey: secret-key
      remoteRef:
        key: galileo/app
        property: secret_key
{{- end }}
