name: Microservices Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    paths:
      - 'services/**'
      - 'proto/**'
      - 'scripts/generate_protos.sh'
      - 'scripts/run_tests.sh'
      - '.github/workflows/services-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - 'proto/**'

jobs:
  services-tests:
    name: Service ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - data-service
          - ml-service
          - inversion-service
          - control-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Service requirements FIRST (their pins are authoritative), then
      # test-only deps without disturbing them. The old order installed
      # unpinned numpy/grpcio first and service pins second with
      # `|| true`, which could silently produce a mixed-ABI environment
      # (numpy compiled-extension mismatches) that fails at import time.
      - name: Install service dependencies (authoritative pins)
        run: |
          python -m pip install --upgrade pip
          if [ -f "services/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.txt"
          fi

      - name: Install test dependencies (never disturb service pins)
        run: |
          # grpcio-tools must match the service's pinned grpcio, or pip
          # silently upgrades grpcio and breaks the pin.
          GRPC_VER=$(python -c "import grpc; print(grpc.__version__)" 2>/dev/null || echo "")
          if [ -n "$GRPC_VER" ]; then
            pip install "grpcio-tools==$GRPC_VER"
          else
            pip install grpcio grpcio-tools
          fi
          # Install ONLY missing test deps. A blanket `pip install numpy`
          # pulls numpy 2.x into jobs whose service doesn't pin it,
          # while compiled deps (pyarrow 14, scipy 1.11) are built for
          # numpy 1.x — an ABI mismatch pip check cannot detect
          # (pyarrow declares no numpy upper bound). Root cause of the
          # red data-service/inversion-service jobs.
          python -c "import pytest" 2>/dev/null || pip install pytest
          python -c "import pytest_asyncio" 2>/dev/null || pip install pytest-asyncio
          python -c "import sqlalchemy" 2>/dev/null || pip install sqlalchemy
          python -c "import numpy" 2>/dev/null || pip install "numpy<2"
          python -c "import google.protobuf" 2>/dev/null || pip install protobuf
          # Advisory: metadata conflicts are surfaced but do not fail
          # the job (e.g. wheel/packaging version squabbles unrelated
          # to the code under test). ABI safety comes from the pins.
          pip check || echo "::warning::pip check reported dependency conflicts (see log)"

      - name: Generate protobuf stubs
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Environment snapshot
        run: |
          python3 --version
          pip freeze | grep -Ei "numpy|scipy|grpcio|protobuf|pytest|pydantic|sqlalchemy|netCDF4|pyarrow" || true

      - name: Run ${{ matrix.service }} tests
        working-directory: services/${{ matrix.service }}
        run: |
          set -o pipefail
          PYTHONPATH="src:src/gen" python3 -m pytest tests/ \
            -o addopts="" -p no:cacheprovider -v 2>&1 | tee /tmp/pytest.log || {
              echo "::group::pytest failure tail"
              tail -80 /tmp/pytest.log
              echo "::endgroup::"
              # Surface the failure summary as annotations
              grep -E "^(FAILED|ERROR|E  )" /tmp/pytest.log | head -10 | \
                while IFS= read -r line; do echo "::error::${line}"; done
              exit 1
            }

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.service }}
          path: /tmp/pytest.log

  all-services-summary:
    name: All services test summary
    runs-on: ubuntu-latest
    needs: services-tests
    if: always()
    steps:
      - name: Report
        run: |
          echo "Microservices test matrix completed."
          echo "See individual service jobs for per-service results."
