# Lean CI for the platform as it exists today.
#
# History: this file was the monolith-era kitchen sink - a Rust test
# matrix (no Rust code remains in the repo), macOS/Windows runners,
# and duplicate CodeQL/Trivy/Bandit/SBOM jobs - and it failed on every
# nightly run. Scanning now lives in security.yml; the microservice
# suites live in services-tests.yml; the compose smoke test lives in
# gate0-smoke.yml. This workflow owns exactly two things: the root
# Python test suite and the documentation build.

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  test-python:
    name: Root test suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from pyproject extras only. The legacy flat
          # requirements.txt is not resolvable on CI runners and is
          # not needed for the unit test suite.
          pip install -e ".[dev,ml,control]"

      - name: Lint with ruff (advisory)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run tests
        # Plain pytest - configuration (testpaths, addopts, markers)
        # lives in pytest.ini, identical to a local run.
        run: pytest

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build docs
        run: mkdocs build

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test-python, docs]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "test-python: ${{ needs.test-python.result }}"
          echo "docs:        ${{ needs.docs.result }}"
          if [ "${{ needs.test-python.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            exit 1
          fi
