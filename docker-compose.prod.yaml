# GALILEO production overlay — single-VM deployment behind Caddy.
#
#   cp .env.production.example .env   # then fill in real secrets
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
#
# What this overlay changes relative to the dev stack:
#   - Caddy terminates TLS on 80/443 (automatic Let's Encrypt for
#     $DOMAIN) and path-routes one origin: gateway under /api, /auth,
#     /health, /docs; the production Next.js UI everywhere else.
#   - The UI runs its optimized production build (same-origin API).
#   - AUTH_MODE=required: every protected endpoint needs a real JWT.
#   - JWT_SECRET has NO fallback - compose refuses to start without it.
#   - No internal service publishes a host port (ports: !reset).
#     Reach Grafana/Prometheus/etc. over an SSH tunnel.
#
# Requires docker compose v2.24+ (for the !reset tag).

name: galileo

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env (e.g. galileo.example.com)}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ui
      - api-gateway
    networks: [galileo]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Empty = same-origin: the browser reaches the gateway through
        # Caddy on the same domain.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
      network: host
    restart: unless-stopped
    expose: ["3000"]
    networks: [galileo]

  api-gateway:
    restart: unless-stopped
    ports: !reset []
    environment:
      - AUTH_MODE=required
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}

  data-service:
    restart: unless-stopped
  ml-service:
    restart: unless-stopped
  inversion-service:
    restart: unless-stopped
  control-service:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    ports: !reset []
  redis:
    restart: unless-stopped
    ports: !reset []
  minio:
    restart: unless-stopped
    ports: !reset []
  kafka:
    restart: unless-stopped
    ports: !reset []
  zookeeper:
    restart: unless-stopped
  jaeger:
    restart: unless-stopped
    ports: !reset []
  prometheus:
    restart: unless-stopped
    ports: !reset []
  grafana:
    restart: unless-stopped
    ports: !reset []
  alertmanager:
    restart: unless-stopped
    ports: !reset []
  mlflow:
    restart: unless-stopped
    ports: !reset []
  postgres-exporter:
    restart: unless-stopped
  redis-exporter:
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
