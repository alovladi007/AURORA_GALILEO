[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-platform"
version = "0.6.0"
description = "GALILEO - Geospatial Analytics, Learning, and Intelligence for Land, Environment & Oceanography. AI-Enhanced Space-Based Earth Observation Platform."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - Research Use Only"}
authors = [
    {name = "GALILEO Team"}
]

dependencies = [
    "jax[cpu]==0.4.20",
    "jaxlib==0.4.20",
    "numpy>=1.24.0,<2.0.0",
    "scipy==1.11.0",
    "pandas==2.0.0",
    "pyarrow>=6.0.0",  # Session 4: Parquet file format
    "xarray==2023.1.0",
    "h5py==3.9.0",
    "netCDF4==1.6.4",
    "matplotlib==3.7.0",
    "seaborn==0.12.0",
    "pyyaml==6.0",
    "pydantic==2.0.0",
    "python-dotenv==1.0.0",
    "tqdm>=4.60.0",  # Session 4: Progress bars
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "mypy==1.5.0",
    "ruff==0.1.0",
    "black==23.7.0",
    "isort==5.12.0",
]

ml = [
    "torch==2.0.0",
    "flax==0.7.0",
    "torchvision>=0.15.0",  # Session 6: Image processing for U-Net
    "scikit-image>=0.20.0",  # Session 6: SSIM metric
    "Pillow>=9.0.0",  # Session 6: Image handling
]

control = [
    "cvxpy>=1.3.0",  # Required for Model Predictive Control (MPC)
]

[tool.setuptools.packages.find]
include = ["sim*", "sensing*", "inversion*", "control*", "ml*", "ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
